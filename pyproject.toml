[project]
name = "pakkenellik"
version = "0.2.0"
description = "Swiss army knife for Bord4's data analysis"
authors = [
    { name = "Lasse Lambrechts", email = "lasse.lambrechts@bt.no" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["analysis", "data", "pandas", "utilities"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.1.2",
    "requests>=2.28.1",
]

[project.urls]
Repository = "https://github.com/BergensTidende/pakkenellik"
Issues = "https://github.com/BergensTidende/pakkenellik/issues"

[project.optional-dependencies]
s3 = ["boto3>=1.26.39"]
nvdb = [
    "geopandas>=0.12.2",
    "pyproj>=3.4.0",
    "shapely>=1.8.0",
    "xmltodict>=0.13.0",
]
gis = ["geopandas>=0.12.2"]
gspread = [
    "gspread>=5.7.2",
    "gspread-dataframe>=3.3.0",
    "gspread-formatting>=1.1.2",
]
ssb = ["pyjstat>=2.3.0"]
viz = ["matplotlib>=3.6.0"]
datawrapper = ["ipython>=8.0.0"]

[dependency-groups]
dev = [
    "bump2version>=1.0.1",
    "mypy>=0.991",
    "pytest>=8.0.0",
    "ruff>=0.11.0",
    "types-requests>=2.28.11.7",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
# 3rd party import
ignore_missing_imports = true
# dynamic typing
disallow_any_unimported = true
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = true
disallow_any_generics = false
disallow_subclassing_any = true
# platform
python_version = "3.10"
# untyped
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
# None and Optional
no_implicit_optional = true
# Warnings
warn_return_any = false
warn_unreachable = true
# Misc
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["pakkenellik"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
